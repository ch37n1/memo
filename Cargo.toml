[workspace]
members = [
    "crates/memo-core",
    "crates/memod",
    "crates/memo",
    "crates/memo-client",
    "crates/memo-ui/src-tauri",
]
resolver = "2"

[workspace.package]
version = "1.0.0-alpha"
edition = "2021"
license = "MIT"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
# Pedantic baseline — catches needless clones, missing docs, implicit conversions
pedantic = { level = "warn", priority = -1 }

# Security: a daemon should never panic on bad input
unwrap_used = "warn"
expect_used = "warn"

# Hygiene: catch leftover debug artifacts before they hit main
todo        = "warn"
dbg_macro   = "warn"
print_stdout = "warn"
print_stderr = "warn"

# Pedantic lints that are too noisy for this project
module_name_repetitions = { level = "allow", priority = 1 }
must_use_candidate      = { level = "allow", priority = 1 }

[workspace.dependencies]
# async runtime
tokio      = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }

# web framework
axum = "0.8"

# http client
reqwest = { version = "0.12", features = ["json", "stream"] }

# serialization
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
base64     = "0.22"
time       = { version = "0.3", features = ["serde", "parsing", "formatting"] }
uuid       = { version = "1", features = ["serde", "v4"] }

# error handling
thiserror = "2"
anyhow    = "1"
async-trait = "0.1"

# CLI
clap = { version = "4", features = ["derive"] }

# database
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "macros", "migrate"] }

# observability
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

# security / crypto
argon2 = "0.5"
rand   = "0.9"

# policy / search
dashmap = "6"
globset = "0.4"
walkdir = "2"
regex   = "1"

# utils
tempfile = "3"
toml     = "0.8"

[profile.dev]
opt-level = 0

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto       = true
strip     = true
